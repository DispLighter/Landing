<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KLKMN</title>
  <meta name="description" content="KLKMN">
  <meta name="theme-color" content="#151515">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23151515'/%3E%3Ctext x='50' y='74' font-size='72' font-weight='700' text-anchor='middle' fill='white' font-family='Helvetica,Arial,sans-serif'%3EK%3C/text%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #151515;
      --fg: #ffffff;
      --muted: #8c8c8c;
      --pink: #ff4fd8;
      --cyan: #35e6d3;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after {
      box-sizing: inherit;
    }

    html {
      height: 100%;
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      width: 100%;
    }

    .countdown {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: clamp(0.5rem, 2vw, 1.5rem);
      flex-wrap: nowrap;
      white-space: nowrap;
      font-size: clamp(0.65rem, 3.1vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      font-variant-numeric: tabular-nums;
    }

    .countdown-item {
      display: flex;
      align-items: baseline;
      gap: 0.18em;
    }

    .countdown-number {
      color: var(--pink);
    }

    .countdown-label {
      color: var(--cyan);
    }

    .countdown-finished {
      font-size: clamp(1.5rem, 6vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    footer {
      padding: 1.5rem 1rem 2rem;
      text-align: center;
      font-size: 0.75rem;
      line-height: 1.7;
      color: var(--muted);
    }

    footer p {
      margin: 0;
    }
  </style>
</head>

<body>
  <main>
    <div class="countdown" id="countdown">
      <div class="countdown-item">
        <span class="countdown-number" id="days">00</span>
        <span class="countdown-label">days</span>
      </div>

      <div class="countdown-item">
        <span class="countdown-number" id="hours">00</span>
        <span class="countdown-label">hours</span>
      </div>

      <div class="countdown-item">
        <span class="countdown-number" id="minutes">00</span>
        <span class="countdown-label">minutes</span>
      </div>

      <div class="countdown-item">
        <span class="countdown-number" id="seconds">00</span>
        <span class="countdown-label">seconds</span>
      </div>
    </div>

    <div class="countdown-finished" id="finished" hidden>
      <span class="countdown-number">Let's</span>
      <span class="countdown-label"> go...</span>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="year">2026</span> KLKMN. All rights reserved.</p>
    <p>KLKMN&trade; is a trademark. Unauthorized use, reproduction or distribution is prohibited.</p>
  </footer>

  <script>
    const target = new Date("2026-11-19T00:00:00+01:00").getTime();

    const countdown = document.getElementById("countdown");
    const finished = document.getElementById("finished");

    const counters = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function updateCountdown() {
      const remaining = Math.max(0, target - Date.now());

      if (remaining === 0) {
        countdown.hidden = true;
        finished.hidden = false;
        return;
      }

      const totalSeconds = Math.floor(remaining / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      counters.days.textContent = String(days).padStart(2, "0");
      counters.hours.textContent = String(hours).padStart(2, "0");
      counters.minutes.textContent = String(minutes).padStart(2, "0");
      counters.seconds.textContent = String(seconds).padStart(2, "0");

      setTimeout(updateCountdown, 1000 - (Date.now() % 1000));
    }

    updateCountdown();
  </script>
</body>
</html>
